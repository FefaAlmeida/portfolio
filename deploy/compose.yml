name: portfolio
services:
  minio:
    image: portfolio-minio:${MINIO_IMAGE_TAG:?Set MINIO_IMAGE_TAG}
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: portfolio
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?Set MINIO_PASSWORD}
    volumes:
      - media:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9000/minio/health/ready']
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [private]
  api:
    image: portfolio-api:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    init: true
    stop_grace_period: 10m
    environment:
      NODE_ENV: production
      PORT: 3001
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL}
      ADMIN_URL: ${ADMIN_URL:-${PUBLIC_URL}}
      DATABASE_PATH: /data/portfolio.sqlite
      BACKUP_DIR: /data/backups
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: portfolio
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: portfolio
      S3_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:?Set MINIO_PASSWORD}
      OPERATIONS_TOKEN: ${OPERATIONS_TOKEN:?Set OPERATIONS_TOKEN}
      API_BASE_URL: http://api:3001
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      I18N_SYNC_TOKEN: ${I18N_SYNC_TOKEN:-}
      I18N_USD_BRL_RATE: ${I18N_USD_BRL_RATE:-7}
    ports: ['127.0.0.1:7153:3001']
    volumes: ['database:/data']
    depends_on:
      minio: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [private]
  web:
    image: portfolio-web:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    init: true
    environment:
      API_URL: http://api:3001
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL}
      ADMIN_URL: ${ADMIN_URL:-${PUBLIC_URL}}
    ports: ['127.0.0.1:7154:3000']
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/admin').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [private]
networks:
  private:
volumes:
  database:
  media:
