name: CI e deploy
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - run: npm run i18n:check
      - run: npm run lint:admin --prefix frontend
      - run: npm run check --prefix backend
      - name: Validate deployment scripts
        run: |
          bash -n scripts/deploy-manual.sh
          sh -n scripts/deploy.sh
          sh -n scripts/deploy-receive.sh
      - run: npm test --prefix backend
      - run: npm run build --prefix frontend
      - run: npx --prefix frontend playwright install --with-deps chromium
      - run: npm run test:e2e --prefix frontend
      - run: npm run test:e2e --prefix frontend -- --config playwright.admin.config.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-results
          path: frontend/test-results/
          retention-days: 7
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: https://fernandagabriela.com
    concurrency:
      group: portfolio-production
      cancel-in-progress: false
    env:
      DEPLOY_SHA: ${{ github.sha }}
      MINIO_TAG: 7aac2a2c5b7c882e68c1ce017d8256be2feea27f
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build API
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: backend/Dockerfile
          target: production
          load: true
          tags: portfolio-api:ci-${{ github.sha }}
          cache-from: type=gha,scope=portfolio-api
          cache-to: type=gha,scope=portfolio-api,mode=max
      - name: Build Next.js
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: frontend/Dockerfile
          target: production
          load: true
          tags: portfolio-web:ci-${{ github.sha }}
          cache-from: type=gha,scope=portfolio-web
          cache-to: type=gha,scope=portfolio-web,mode=max
      - name: Build MinIO
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/minio.Dockerfile
          load: true
          tags: portfolio-minio:${{ env.MINIO_TAG }}
          cache-from: type=gha,scope=portfolio-minio
          cache-to: type=gha,scope=portfolio-minio,mode=max
      - name: Check that this is still the latest main commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$latest" = "$DEPLOY_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Newer main commit exists; skipping this deployment.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy to VPS
        if: steps.current.outputs.deploy == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          umask 077
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$ssh_dir"' EXIT
          test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_KNOWN_HOSTS" && test -n "$DEPLOY_HOST"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          docker save "portfolio-api:ci-$DEPLOY_SHA" "portfolio-web:ci-$DEPLOY_SHA" "portfolio-minio:$MINIO_TAG" |
            gzip -1 |
            ssh -T -i "$ssh_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts" \
              -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=12 \
              "root@$DEPLOY_HOST" "deploy $DEPLOY_SHA"
      - name: Check public endpoints
        if: steps.current.outputs.deploy == 'true'
        run: |
          for url in https://fernandagabriela.com/api/health https://fernandagabriela.com/ https://fernandagabriela.com/en https://admin.fernandagabriela.com/; do
            curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 --max-time 30 "$url" -o /dev/null
          done
          printf 'Deployed `%s` to https://fernandagabriela.com\n' "$DEPLOY_SHA" >> "$GITHUB_STEP_SUMMARY"
