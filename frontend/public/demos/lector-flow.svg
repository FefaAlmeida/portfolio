<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320"><rect width="880" height="320" fill="#f2e9dc"/><text x="440" y="58" text-anchor="middle" font-family="Georgia,serif" font-size="29" fill="#652837">Uma biblioteca conectada</text><rect x="85" y="91" width="220" height="160" rx="14" fill="#ffffff" fill-opacity=".65"/><circle cx="115" cy="124" r="16" fill="#652837"/><text x="115" y="129" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="white">01</text><text x="105" y="178" font-family="Georgia,serif" font-size="25" fill="#652837">Explorar</text><text x="105" y="210" font-family="Arial,sans-serif" font-size="13" fill="#5a5451">Encontre sua próxima leitura.</text><rect x="330" y="91" width="220" height="160" rx="14" fill="#ffffff" fill-opacity=".65"/><circle cx="360" cy="124" r="16" fill="#652837"/><text x="360" y="129" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="white">02</text><text x="350" y="178" font-family="Georgia,serif" font-size="25" fill="#652837">Solicitar</text><text x="350" y="210" font-family="Arial,sans-serif" font-size="13" fill="#5a5451">Reserve um livro do acervo.</text><rect x="575" y="91" width="220" height="160" rx="14" fill="#ffffff" fill-opacity=".65"/><circle cx="605" cy="124" r="16" fill="#652837"/><text x="605" y="129" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="white">03</text><text x="595" y="178" font-family="Georgia,serif" font-size="25" fill="#652837">Gerenciar</text><text x="595" y="210" font-family="Arial,sans-serif" font-size="13" fill="#5a5451">Acompanhe o empréstimo.</text><text x="440" y="292" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#746960">Diagrama ilustrativo do fluxo</text></svg>